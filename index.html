        .container { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        img { width: 100%; height: 100%; object-fit: cover; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>

<div class="container" onclick="start()">
    <img src="main.jpg" alt="Invitation">

<audio id="audio" src="songwed.mp3"></audio>

<script>
    function start() {
        const audio = document.getElementById('audio');
        audio.play(); // تشغيل الصوت فور الضغط
        
        // التحويل للينك الخاص بك
        setTimeout(() => {
            window.location.href = "https://farhainvitation.online/citadel-template";
