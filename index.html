<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tags للواتساب والفيسبوك -->
    <meta property="og:title" content="دعوة خاصة">
    <meta property="og:description" content="اضغط لفتح الدعوة">
    <meta property="og:image" content="https://ibb.co/C312fQPD">
    <meta property="og:url" content="farhainvitation.site">
    
    <title>دعوة خاصة</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #container {
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer;
        }
        #mainImage {
            width: 100%; height: 100%; object-fit: cover;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="container" onclick="handleInteraction()">
    <img id="mainImage" src="envelope-closed.jpg" alt="Invitation">
</div>

<audio id="bgMusic" src="songwed.mp3" loop></audio>

<script>
    function handleInteraction() {
        const audio = document.getElementById('bgMusic');
        audio.play().catch(e => console.log("Waiting for user interaction"));
        
        // التحويل للينك المطلوب بعد الضغط
        window.location.href = "https://mohamed-sama.farhainvitation.site/";
    }
</script>
</body>
</html>
